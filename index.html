<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>qPCR計算</title><style>
:root{color-scheme:light dark;--bg:#f7fafc;--fg:#18212b;--card:#fff;--line:#cbd5e1;--accent:#2563eb;--water:#38bdf8;--dna:#a855f7}body.dark{--bg:#10151d;--fg:#e8edf5;--card:#18212b;--line:#3b4654;--accent:#60a5fa;--water:#38bdf8;--dna:#c084fc}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 40px}h1{font-size:1.5rem;margin:0}.top{display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:8px;margin:20px 0;border-bottom:1px solid var(--line)}button,input,select{font:inherit}button{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}button[aria-selected=true]{background:var(--accent);color:white}.panel{display:none}.panel.active{display:block}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;font-weight:600}input,select{padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}.big{font-size:1.4rem;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:10px 2px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}.diagram{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.tube{width:104px;height:142px;position:relative;border:3px solid var(--fg);border-top:0;border-radius:0 0 24px 24px;text-align:center;padding-top:8px;overflow:hidden}.tube:before{content:"";position:absolute;top:0;left:-5px;width:110px;border-top:9px solid var(--fg);border-radius:8px}.fill{position:absolute;bottom:0;left:0;width:100%;background:var(--water);height:70%;opacity:.72}.tube b,.tube span{position:relative;z-index:1;display:block}.arrow{font-size:2rem;color:var(--accent)}.legend{font-size:.9rem}.water{color:var(--water)}.dna{color:var(--dna)}@media(max-width:430px){.grid{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
</style><body><main><div class="top"><h1>qPCR 計算</h1><button id="theme" type="button">☾ ダーク</button></div><div class="tabs" role="tablist"><button id="mixTab" aria-selected="true">マスターミックス</button><button id="dilTab" aria-selected="false">段階希釈</button></div>
<div id="mix" class="panel active"><div class="box grid"><label>必要反応数<input id="n" type="number" value="10" min="1"></label><label>余裕分（反応）<input id="extra" type="number" value="2" min="0"></label></div><div class="box"><p class="big" id="count"></p><table><tr><td>Fast SYBR Green Master Mix</td><td id="sybr"></td></tr><tr><td>Primer F</td><td id="pf"></td></tr><tr><td>Primer R</td><td id="pr"></td></tr><tr><td>水</td><td id="mw"></td></tr><tr><th>マスターミックス合計</th><th id="mt"></th></tr></table><p id="temp"></p></div></div>
<div id="dil" class="panel"><div class="box grid"><label>希釈倍率<select id="factor"><option value="2">2倍</option><option value="5">5倍</option><option value="10">10倍</option></select></label><label>1本の最終量（µL）<input id="vol" type="number" value="100" min="1"></label><label>希釈点数（原液を含む）<input id="points" type="number" value="5" min="2"></label></div><div class="box"><p class="big" id="title"></p><div class="diagram"><div class="tube"><b>前のチューブ</b><span class="dna" id="move"></span></div><div class="arrow">→</div><div class="tube"><b>次のチューブ</b><span class="water" id="water"></span><div class="fill"></div></div></div><p class="legend" id="how"></p><table><tr><td>水（先に入れる）</td><td id="w"></td></tr><tr><td>前のチューブから移すtemplate</td><td id="t"></td></tr><tr><th>合計</th><th id="sum"></th></tr></table></div></div></main><script>
const $=x=>document.getElementById(x),f=x=>`${+x.toFixed(3)} µL`;function tabs(x){$('mix').classList.toggle('active',x==='m');$('dil').classList.toggle('active',x==='d');$('mixTab').setAttribute('aria-selected',x==='m');$('dilTab').setAttribute('aria-selected',x==='d')}$('mixTab').onclick=()=>tabs('m');$('dilTab').onclick=()=>tabs('d');$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'☀ ライト':'☾ ダーク'};function mix(){let n=+$('n').value,e=+$('extra').value,c=n+e;$('count').textContent=`${c} 反応分を調製`;$('sybr').textContent=f(c*5);$('pf').textContent=$('pr').textContent=f(c*.2);$('mw').textContent=f(c*.6);$('mt').textContent=f(c*6);$('temp').textContent=`templateは個別に ${f(n*4)}（4 µL × ${n}反応）`}function dil(){let q=+$('factor').value,v=+$('vol').value,p=+$('points').value,t=v/q,w=v-t;$('title').textContent=`${q}倍希釈：チューブ2〜${p}`;$('move').textContent=`template ${f(t)}`;$('water').textContent=`水 ${f(w)} を先に`; $('how').textContent=`水を先に入れる → 前のチューブからtemplateを移す → 混和。原液→2→3…と繰り返す。`;$('w').textContent=f(w);$('t').textContent=f(t);$('sum').textContent=f(v)};['n','extra'].forEach(x=>$(x).oninput=mix);['factor','vol','points'].forEach(x=>$(x).oninput=dil);mix();dil();
</script><style>.tube-seq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}.microtube{width:66px;height:100px;clip-path:polygon(7% 0,93% 0,76% 76%,50% 100%,24% 76%);background:var(--fg);padding:3px;box-sizing:border-box}.microtube>div{height:100%;clip-path:inherit;background:var(--card);text-align:center;padding-top:8px;box-sizing:border-box}.microtube b,.microtube span{display:block;font-size:.75rem}.microtube b{font-size:1rem}.seq-arrow{color:var(--accent);font-size:1.2rem;text-align:center}.seq-arrow small{display:block;font-size:.62rem}</style><script>function drawTubes(){let p=+$('points').value,q=+$('factor').value,v=+$('vol').value,t=v/q,w=v-t;let html='<div class="tube-seq">';for(let i=0;i<p;i++){if(i)html+=`<div class="seq-arrow">→<small>${f(t)}</small></div>`;html+=`<div class="microtube"><div><b>${i+1}</b><span>${i?'水':''}</span><span>${i?f(w):'原液'}</span></div></div>`}html+='</div>';document.querySelector('#dil .diagram').innerHTML=html;$('title').textContent=`${q}倍希釈：${p}本のチューブ`;$('how').textContent=`チューブ2〜${p}へ水${f(w)}を先に入れ、前のチューブから${f(t)}ずつ移して混和する。`}['factor','vol','points'].forEach(x=>$(x).addEventListener('input',drawTubes));drawTubes();</script>
